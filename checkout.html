<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="media-header">
    <img class="logo" src="images/full_logo_bg_white.png" alt="full_logo">
    <div class=" medium" style="color: #000"> <span class="menu-mobile">Menu</span>

      <nav class="nav-list">
        <a href="index.html">Home</a>
        <a href="index.html">Precos</a>
        <a href="index.html">Sabores</a>
      </nav>
    </div>
    <div class="icon-group">
      <a href=""><img class="icon" src="images/user.svg" alt="profile"></a>
      <a href=""><img class="icon" src="images/shopping_cart.svg" alt="cart"></a>
    </div>
  </header>

  <section class="container-formulario">
    <div class="grupo-formulario">
      <h2>Contato</h2>
      <div class="grid-layout">
        <div class="campo">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" placeholder="Seu nome">
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="voce@exemplo.com">
        </div>
        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" placeholder="(11) 99999-0000">
        </div>
        <div class="campo">
          <label for="cep">CEP</label>
          <input type="text" id="cep" placeholder="00000-000">
        </div>
      </div>
    </div>


    <div class="grupo-formulario">
      <h2>Entrega</h2>

      <div class="grid-entrega-topo">
        <div class="campo">
          <label for="endereco">Endereço</label>
          <input type="text" id="endereco" placeholder="Rua, avenida...">
        </div>
        <div class="campo">
          <label for="numero">Número</label>
          <input type="text" id="numero" placeholder="123">
        </div>
        <div class="campo">
          <label for="complemento">Complemento</label>
          <input type="text" id="complemento" placeholder="Apto, bloco">
        </div>
      </div>
      <div class="grid-layout">
        <div class="campo">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" placeholder="São Paulo">
        </div>
        <div class="campo">
          <label for="estado">Estado</label>
          <input type="text" id="estado" placeholder="SP">
        </div>
      </div>
    </div>
    <div class="grupo-formulario">
      <h2>Pagamento</h2>
      <div class="grid-layout">
        <div class="campo">
          <label for="pagamento">Formas de Pagamento</label>
          <select name="pagamento" id="pagamento">
            <option value="">Selecione uma opção</option>
            <option value="pix">Pix</option>
            <option value="cartao">Cartão de Crédito</option>
            <option value="boleto">Boleto Bancário</option>
          </select>
        </div>
      </div>
      <div class="campo campo-textarea">
        <label for="observacoes">Observações</label>

        <textarea name="observacoes" id="observacoes" placeholder="Alguma observação sobre o pedido?"></textarea>
      </div>
    </div>
  </section>

</body>

</html>
